name: Fix Bolivia payment filter

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/fix-bolivia-payment-filter.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Aplicar filtro de pagos por país
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("panel/index.html")
          s=p.read_text(encoding="utf-8")
          marker='id="paymentVisibilityVeripagosCard"'
          if marker in s:
              print("El parche ya está aplicado.")
              raise SystemExit(0)

          old_html='''<div class="span4"><label class="item" style="display:flex;gap:10px;align-items:flex-start"><input id="sacceptMercadoPago" type="checkbox" style="width:auto;margin-top:3px" onchange="syncPaymentVisibilitySettings()"><span><b>💳 Mercado Pago</b><small id="sacceptMercadoPagoHint" class="mut" style="display:block;margin-top:4px">Aparece solo si el país y las credenciales del restaurante lo permiten.</small></span></label></div>'''
          new_html='''<div class="span4" id="paymentVisibilityMercadoPagoCard"><label class="item" style="display:flex;gap:10px;align-items:flex-start"><input id="sacceptMercadoPago" type="checkbox" style="width:auto;margin-top:3px" onchange="syncPaymentVisibilitySettings()"><span><b>💳 Mercado Pago</b><small id="sacceptMercadoPagoHint" class="mut" style="display:block;margin-top:4px">Aparece solo si el país y las credenciales del restaurante lo permiten.</small></span></label></div>
        <div class="span4" id="paymentVisibilityVeripagosCard" hidden><label class="item" style="display:flex;gap:10px;align-items:flex-start"><input id="sacceptVeripagos" type="checkbox" style="width:auto;margin-top:3px" onchange="syncVeripagosPaymentVisibilitySettings(this.checked)"><span><b>▣ QR Bolivia</b><small id="sacceptVeripagosHint" class="mut" style="display:block;margin-top:4px">Disponible para negocios configurados en Bolivia.</small></span></label></div>'''
          if old_html not in s:
              raise SystemExit("No se encontró la tarjeta actual de Mercado Pago")
          s=s.replace(old_html,new_html,1)

          if 'veripagosRestaurantConfigured=false,veripagosRestaurantCredentialsReady=false' not in s:
              s=s.replace('veripagosRestaurantConfigured=false,', 'veripagosRestaurantConfigured=false,veripagosRestaurantCredentialsReady=false,', 1)

          start=s.index('function syncPaymentVisibilitySettings(){')
          end=s.index('const qrPaymentTypes=', start)
          new_functions=r'''function syncVeripagosPaymentVisibilitySettings(checked){
 const main=document.getElementById("restaurantVeripagosEnabled");
 if(main)main.checked=!!checked;
 syncPaymentVisibilitySettings()
}
async function saveVeripagosPaymentVisibilityFromMethods(enabled){
 const country=countryByCode(document.getElementById("scountry")?.value||currentRestaurantConfig?.country_code||"CL");
 if(String(country.code||"")!=="BO")return;
 if(enabled&&!veripagosRestaurantCredentialsReady)throw new Error("Primero configura y guarda las credenciales de QR Bolivia.");
 const {data:{session}}=await sb.auth.getSession();
 if(!session?.access_token)throw new Error("Tu sesión venció.");
 const body={
  restaurant_id:currentRestaurant,
  basic_username:document.getElementById("restaurantVeripagosUser")?.value.trim()||"",
  basic_password:"",
  secret_key:"",
  vigencia:document.getElementById("restaurantVeripagosVigencia")?.value.trim()||"0/00:15",
  enabled:!!enabled
 };
 const res=await fetch(SB_URL+"/functions/v1/restaurant-veripagos-settings",{method:"POST",headers:{"Content-Type":"application/json","apikey":SB_KEY,"Authorization":"Bearer "+session.access_token},body:JSON.stringify(body)});
 const d=await res.json();
 if(!res.ok)throw new Error(d.error||"No se pudo actualizar QR Bolivia");
 veripagosRestaurantConfigured=!!d.configured;
 await loadRestaurantVeripagosSettings();
}
function syncPaymentVisibilitySettings(){
 const country=countryByCode(document.getElementById("scountry")?.value||currentRestaurantConfig?.country_code||"CL"),
  isBolivia=String(country.code||"")==="BO",
  cash=document.getElementById("sacceptCash"),
  transfer=document.getElementById("sacceptTransfer"),
  mp=document.getElementById("sacceptMercadoPago"),
  mpCard=document.getElementById("paymentVisibilityMercadoPagoCard"),
  hint=document.getElementById("sacceptMercadoPagoHint"),
  vp=document.getElementById("sacceptVeripagos"),
  vpCard=document.getElementById("paymentVisibilityVeripagosCard"),
  vpHint=document.getElementById("sacceptVeripagosHint"),
  summary=document.getElementById("paymentVisibilitySummary");
 if(mpCard)mpCard.hidden=!country.mercadopago_enabled;
 if(mp){mp.disabled=!country.mercadopago_enabled;if(!country.mercadopago_enabled)mp.checked=false}
 if(hint)hint.textContent=country.mercadopago_enabled?"Aparece solo si las credenciales de Mercado Pago están validadas.":"Mercado Pago no está disponible para el país seleccionado.";
 if(vpCard)vpCard.hidden=!isBolivia;
 if(vp){
  if(!isBolivia){vp.checked=false;vp.disabled=true}
  else{
   const main=document.getElementById("restaurantVeripagosEnabled");
   if(main)vp.checked=!!main.checked;
   vp.disabled=!veripagosRestaurantCredentialsReady;
  }
 }
 if(vpHint)vpHint.textContent=!isBolivia?"QR Bolivia solo está disponible para negocios de Bolivia.":(veripagosRestaurantCredentialsReady?"Activa o desactiva QR Bolivia para tus clientes.":"Configura primero las credenciales en la sección QR Bolivia.");
 if(summary){
  const enabled=[];
  if(cash?.checked)enabled.push("Efectivo");
  if(transfer?.checked)enabled.push("Transferencia");
  if(mp?.checked&&!mp.disabled)enabled.push("Mercado Pago");
  if(vp?.checked&&!vp.disabled)enabled.push("QR Bolivia");
  summary.innerHTML=enabled.length?"<b>Visibles al cliente:</b> "+enabled.map(esc).join(" · "):"<b>Sin métodos base activos.</b> Los clientes solo verán otros métodos alternativos o QR que tengas configurados."
 }
}
async function savePaymentMethodVisibility(){
 if(!currentRestaurant)return toast("No hay negocio seleccionado");
 const country=countryByCode(document.getElementById("scountry")?.value||currentRestaurantConfig?.country_code||"CL"),
  isBolivia=String(country.code||"")==="BO",
  cash=!!document.getElementById("sacceptCash")?.checked,
  transfer=!!document.getElementById("sacceptTransfer")?.checked,
  mpEl=document.getElementById("sacceptMercadoPago"),
  mp=!!mpEl?.checked&&!mpEl?.disabled,
  vpEl=document.getElementById("sacceptVeripagos"),
  qrBolivia=isBolivia&&!!vpEl?.checked;
 if(qrBolivia&&!veripagosRestaurantCredentialsReady){syncPaymentVisibilitySettings();return toast("Configura primero las credenciales de QR Bolivia para poder activarlo.")}
 const {error}=await sb.from("restaurants").update({accept_cash:cash,accept_bank_transfer:transfer,accept_mercadopago:mp,updated_at:new Date().toISOString()}).eq("id",currentRestaurant);
 if(error)return toast(error.message);
 try{if(isBolivia)await saveVeripagosPaymentVisibilityFromMethods(qrBolivia)}catch(e){return toast(e.message||"No se pudo actualizar QR Bolivia")}
 currentRestaurantConfig={...(currentRestaurantConfig||{}),accept_cash:cash,accept_bank_transfer:transfer,accept_mercadopago:mp};
 syncPaymentVisibilitySettings();
 toast("Métodos de pago actualizados")
}
'''
          s=s[:start]+new_functions+s[end:]

          old='veripagosRestaurantConfigured=!!d.configured;'
          new='veripagosRestaurantConfigured=!!d.configured;veripagosRestaurantCredentialsReady=!!d.basic_username&&!!d.has_basic_password&&!!d.has_secret_key;'
          if old not in s:
              raise SystemExit("No se encontró el estado de VeriPagos")
          s=s.replace(old,new,1)

          old_status='if(status)status.textContent=d.configured?"✅ QR Bolivia conectado y disponible para este restaurante.":(d.available===false?"QR Bolivia solo se habilita cuando el país es Bolivia.":"VeriPagos todavía no está completamente configurado.");'
          new_status=old_status+'const visibilityToggle=document.getElementById("sacceptVeripagos");if(visibilityToggle)visibilityToggle.checked=!!d.enabled;syncPaymentVisibilitySettings();'
          if old_status not in s:
              raise SystemExit("No se encontró el render del estado VeriPagos")
          s=s.replace(old_status,new_status,1)

          p.write_text(s,encoding="utf-8")
          print("Parche aplicado.")
          PY

      - name: Validar calidad
        run: |
          npm ci
          npm run check

      - name: Guardar cambio en staging
        run: |
          if git diff --quiet -- panel/index.html; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "YummyPro QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add panel/index.html
          git commit -m "fix: filtrar Mercado Pago y QR Bolivia por país"
          git push origin HEAD:staging
