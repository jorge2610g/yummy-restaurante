name: Aplicar selector movil 2x2 una vez
on:
  push:
    paths:
      - '.github/workflows/mobile-vertical-grid-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compactar selector vertical en movil
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '@media(max-width:800px){.vertical-switch-wrap{top:0;position:relative}.vertical-switch{grid-template-columns:1fr;gap:6px;padding:8px 0}.vertical-choice{min-height:46px}.vertical-choice .vertical-kicker{display:inline;margin-left:5px}}'
          new = '@media(max-width:800px){.vertical-switch-wrap{top:0;position:relative}.vertical-switch{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:8px 0}.vertical-choice{min-height:68px;padding:9px 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.15}.vertical-choice .vertical-kicker{display:block;margin:4px 0 0;font-size:9px;line-height:1.2;letter-spacing:0}}'
          if old not in text:
              raise SystemExit('No se encontro la regla movil esperada; no se modifico el archivo')
          text = text.replace(old, new, 1)
          if 'v2.1.7</div>' in text:
              text = text.replace('v2.1.7</div>', 'v2.1.8</div>', 1)
          path.write_text(text, encoding='utf-8')
      - name: Guardar cambio y retirar automatizacion temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/mobile-vertical-grid-once.yml
          git add index.html .github/workflows/mobile-vertical-grid-once.yml
          git commit -m "fix(landing): selector movil 2x2 v2.1.8"
          git push
