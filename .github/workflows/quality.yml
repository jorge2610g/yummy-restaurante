name: Calidad del panel restaurante
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          RESTAURANT_TEST_EMAIL: ${{ secrets.RESTAURANT_TEST_EMAIL }}
          RESTAURANT_TEST_PASSWORD: ${{ secrets.RESTAURANT_TEST_PASSWORD }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with: {name: restaurante-test-report, path: playwright-report, if-no-files-found: ignore}
