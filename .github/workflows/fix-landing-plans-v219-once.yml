name: Corregir carga de planes landing v2.1.9 una vez
on:
  push:
    paths:
      - '.github/workflows/fix-landing-plans-v219-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar corrección
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old='sb.from("subscription_plans").select("id,name,amount,days,modules,currency_code,country_prices,is_default_trial,business_type").eq("active",true).in("business_type",["restaurant","supermarket","minimarket","professional"]).order("amount",{ascending:true})'
          new='sb.from("subscription_plans").select("id,name,amount,days,modules,currency_code,country_prices,is_default_trial,business_type").eq("active",true).in("business_type",["restaurant","supermarket","minimarket","professional","streaming"]).order("amount",{ascending:true})'
          assert old in s, 'No se encontró la consulta de planes esperada'
          s=s.replace(old,new,1)

          old='''  const [countriesRes,plansRes]=await Promise.all([\n    sb.from("platform_countries").select("code,name,currency_code,locale,timezone").eq("active",true).order("name"),\n    sb.from("subscription_plans").select("id,name,amount,days,modules,currency_code,country_prices,is_default_trial,business_type").eq("active",true).in("business_type",["restaurant","supermarket","minimarket","professional","streaming"]).order("amount",{ascending:true})\n  ]);'''
          new='''  let countriesRes,plansRes;\n  try{\n    [countriesRes,plansRes]=await Promise.race([\n      Promise.all([\n        sb.from("platform_countries").select("code,name,currency_code,locale,timezone").eq("active",true).order("name"),\n        sb.from("subscription_plans").select("id,name,amount,days,modules,currency_code,country_prices,is_default_trial,business_type").eq("active",true).in("business_type",["restaurant","supermarket","minimarket","professional","streaming"]).order("amount",{ascending:true})\n      ]),\n      new Promise((_,reject)=>setTimeout(()=>reject(new Error("Tiempo de espera agotado al cargar planes")),8000))\n    ]);\n  }catch(e){\n    console.warn("No pudimos cargar los planes",e);\n    el.innerHTML='<div class="card"><b>Los planes están tardando más de lo normal.</b><p style="color:#aaa">Puedes reintentar o crear tu cuenta con 30 días gratis.</p><div class="heroBtns" style="margin-top:14px"><button class="btn ghost" onclick="loadPublicPlans()">Reintentar</button><button class="btn primary" onclick="openSignup()">30 días gratis</button></div></div>';\n    return;\n  }'''
          assert old in s, 'No se encontró el bloque de carga esperado'
          s=s.replace(old,new,1)

          old='if(!availablePaidTypes.has(landingBusinessType)){const first=landingPlanBusinessTypes().find(t=>availablePaidTypes.has(t));if(first)landingBusinessType=first}'
          new='if(!availablePaidTypes.has(landingBusinessType)&&landingPlanBusinessTypes().length>1){const first=landingPlanBusinessTypes().find(t=>availablePaidTypes.has(t));if(first)landingBusinessType=first}'
          assert old in s, 'No se encontró el fallback de tipo de negocio'
          s=s.replace(old,new,1)

          old='''  const publicPlans=landingPlans.filter(p=>!p.is_default_trial&&String(p.business_type||"restaurant")===landingBusinessType);\n  const priced=await Promise.all(publicPlans.map(async p=>({p,price:await planLocalAmount(p,country)})));'''
          new='''  const publicPlans=landingPlans.filter(p=>!p.is_default_trial&&String(p.business_type||"restaurant")===landingBusinessType);\n  if(!publicPlans.length){\n    const isStreaming=landingBusinessType==="streaming";\n    el.innerHTML=isStreaming\n      ? '<div class="card"><span class="tag">30 DÍAS GRATIS</span><h3 style="margin-top:16px">Empieza con Streaming</h3><p style="color:#aaa">Todavía no hay planes de pago publicados para Streaming. Puedes crear tu cuenta y usar la prueba gratuita de 30 días.</p><button class="btn primary" style="margin-top:16px" onclick="openSignup()">Crear cuenta gratis</button></div>'\n      : '<div class="card">No hay planes de pago disponibles para '+escPlan(landingBusinessLabel(landingBusinessType))+' en este momento. <button class="btn primary" style="margin-top:14px" onclick="openSignup()">Prueba 30 días gratis</button></div>';\n    return;\n  }\n  const priced=await Promise.all(publicPlans.map(async p=>({p,price:await planLocalAmount(p,country)})));'''
          assert old in s, 'No se encontró el render de planes esperado'
          s=s.replace(old,new,1)

          assert 'v2.1.8' in s, 'No se encontró la versión v2.1.8'
          s=s.replace('v2.1.8','v2.1.9',1)
          p.write_text(s)
          PY
          rm -f .github/workflows/fix-landing-plans-v219-once.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-landing-plans-v219-once.yml
          git commit -m "fix(landing): evitar carga infinita de planes v2.1.9"
          git push