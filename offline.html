<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>YummyPro · Sin conexión</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(135deg,#07111f,#0c1b2f);color:#f6f8fb;font-family:Inter,system-ui,sans-serif}.card{width:min(440px,100%);padding:26px;border:1px solid #203550;border-radius:22px;background:#0e1d30;box-shadow:0 24px 70px #0006;text-align:center}.mark{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 16px;border-radius:20px;background:#ffb703;color:#171000;font-size:36px;font-weight:950}.mut{color:#9fb0c5;line-height:1.5}.notice{margin:18px 0;padding:13px;border:1px solid #7f1d1d;border-radius:14px;background:#3b1720;color:#fecdd3;font-size:13px}.btn{display:block;width:100%;margin-top:16px;padding:13px 16px;border:0;border-radius:12px;background:#ffb703;color:#171000;font-weight:900;text-decoration:none;cursor:pointer}
</style>
</head>
<body>
<main class="card">
 <div class="mark">Y</div>
 <h1>Estás sin conexión</h1>
 <p class="mut">YummyPro necesita internet para consultar datos en tiempo real y procesar cambios del restaurante.</p>
 <div class="notice"><b>Protección activa:</b> no se guardarán pedidos, pagos ni cambios mientras estés sin internet.</div>
 <a class="btn" href="/panel/">Reintentar conexión</a>
</main>
<script>
window.addEventListener("online",()=>location.replace("/panel/"));
</script>
</body>
</html>
